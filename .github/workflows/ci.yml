name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: Simulation self-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify the Python port matches the Kotlin scheduler
        run: |
          python simulation/make_vectors.py
          git diff --exit-code -- simulation/expected_vectors.json \
            android/app/src/test/resources/srs_vectors.json \
            || (echo "::error::Scheduler vectors are stale - run simulation/make_vectors.py" && exit 1)

      - name: Run simulation harness self-checks
        run: python simulation/test_simulation.py

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-bg-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  lint:
    name: Pipeline scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # setup-python installs a bare interpreter; pytest is not part of it.
      - name: Install pytest
        run: pip install --upgrade pytest

      - name: Byte-compile every pipeline script
        run: python -m compileall -q pipeline simulation

      - name: Run the pipeline doctests
        run: |
          python -m pytest --doctest-modules -q \
            pipeline/pinyin_utils.py \
            pipeline/03_build_vocab.py \
            pipeline/07_translate_bulgarian.py

      - name: Check the pipeline scripts expose the expected entry points
        run: |
          for f in 01_fetch_sources 02_build_dictionary 03_build_vocab \
                   04_build_grammar 05_build_sentences 06_build_audio \
                   07_translate_bulgarian 08_build_content_db \
                   09_clean_glosses 10_compare_models; do
            test -f "pipeline/${f}.py" || { echo "::error::missing pipeline/${f}.py"; exit 1; }
          done
          echo "all pipeline entry points present"
